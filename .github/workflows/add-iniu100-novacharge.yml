name: Add INIU 100W to Nova Charge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-iniu100-novacharge.yml'

permissions:
  contents: write

jobs:
  patch-nova-charge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '  cable100:"https://bsenova.com/products/ugreen-cable-usb-c-100w-2-m-nylon-tresse",\n  cableUsbC:'
          new = '  cable100:"https://bsenova.com/products/ugreen-cable-usb-c-100w-2-m-nylon-tresse",\n  iniu100:"https://bsenova.com/products/iniu-d5cc-cable-usb-c-vers-usb-c-100w-2-m-nylon-tresse",\n  cableUsbC:'
          assert s.count(old) == 1, f'PRODUCTS anchor count={s.count(old)}'
          s = s.replace(old, new)

          old = '''function chooseAnkerWireless(d){\n'''
          new = '''function chooseIniuCable(d){\n  const usbC=!d.cable.includes("Lightning") && /USB.C.*USB.C/.test(d.cable);\n  return usbC && !d.proprietary && d.cableW===100\n    ? {url:PRODUCTS.iniu100,label:"Voir le câble INIU USB-C 100 W – 2 m"} : null;\n}\nfunction chooseAnkerWireless(d){\n'''
          assert s.count(old) == 1, f'chooseIniu anchor count={s.count(old)}'
          s = s.replace(old, new)

          old = '''function showNewSingle(d){\n  showNewOption("wallLink","Portable",chooseNewPortable(d),\n    "Option nomade : batterie Anker A1695, 25 000 mAh. Jusqu’à 100 W sur une sortie USB-C ; 165 W au total pour deux appareils, 130 W au total pour trois ou quatre. Deux câbles USB-C intégrés et une prise USB-C. Pour Lightning, utilise un câble USB-C vers Lightning séparé. La puissance reçue dépend de l’appareil ; la charge rapide PPS n’est pas validée ici.");\n  showNewOption("carLink","Retractable",chooseNewCar(d),\n'''
          new = '''function showNewSingle(d){\n  showNewOption("wallLink","Portable",chooseNewPortable(d),\n    "Option nomade : batterie Anker A1695, 25 000 mAh. Jusqu’à 100 W sur une sortie USB-C ; 165 W au total pour deux appareils, 130 W au total pour trois ou quatre. Deux câles USB-C intégrés et une prise USB-C. Pour Lightning, utilise un câble USB-C vers Lightning séparé. La puissance reçue dépend de l’appareil ; la charge rapide PPS n’est pas validée ici.");\n  showNewOption("cableLink","Iniu",chooseIniuCable(d),\n    "Alternative 100 W : INIU D5CC USB-C vers USB-C, 2 m, PD 3.0, E-Marker et nylon tressé. Jusqu’à 480 Mb/s ; ce câble est destiné à la charge et ne prend pas en charge la sortie vidéo/Thunderbolt.");\n  showNewOption("carLink","Retractable",chooseNewCar(d),\n'''
          # Keep exact original wording: correct accidental typo in replacement before applying.
          new = new.replace('Deux câles USB-C', 'Deux câbles USB-C')
          assert s.count(old) == 1, f'showNewSingle anchor count={s.count(old)}'
          s = s.replace(old, new)

          old = '''selectedMulti.filter(d=>chooseAnkerCable(d)).forEach(d=>{const row=document.createElement("div");row.className="footnote";row.style.paddingTop="10px";const link=document.createElement("a");link.href=chooseAnkerCable(d).url;link.target="_blank";link.rel="sponsored noopener";link.style.color="#7dd3fc";link.textContent=d.model+(d.cable.includes("Lightning")?" : câble Anker USB-C vers Lightning MFi 1,8 m":" : câble Anker Prime USB-C 240 W (charge)");row.appendChild(link);cableBox.appendChild(row)});multiStatus.textContent='''
          new = '''selectedMulti.filter(d=>chooseAnkerCable(d)).forEach(d=>{const row=document.createElement("div");row.className="footnote";row.style.paddingTop="10px";const link=document.createElement("a");link.href=chooseAnkerCable(d).url;link.target="_blank";link.rel="sponsored noopener";link.style.color="#7dd3fc";link.textContent=d.model+(d.cable.includes("Lightning")?" : câble Anker USB-C vers Lightning MFi 1,8 m":" : câble Anker Prime USB-C 240 W (charge)");row.appendChild(link);cableBox.appendChild(row)});selectedMulti.filter(d=>chooseIniuCable(d)).forEach(d=>{const row=document.createElement("div");row.className="footnote";row.style.paddingTop="10px";const link=document.createElement("a");link.href=chooseIniuCable(d).url;link.target="_blank";link.rel="sponsored noopener";link.style.color="#7dd3fc";link.textContent=d.model+" : câble INIU USB-C 100 W – 2 m";row.appendChild(link);cableBox.appendChild(row)});multiStatus.textContent='''
          assert s.count(old) == 1, f'multi anchor count={s.count(old)}'
          s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-iniu100-novacharge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-iniu100-novacharge.yml
          git commit -m "Add INIU 100W cable alternative to Nova Charge"
          git push
